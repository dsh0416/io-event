name: Benchmark

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: ${{matrix.selector}} on ${{matrix.os}} (${{matrix.ruby}})
    runs-on: ${{matrix.os}}-latest

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu

        ruby:
          - head

        selector:
          - EPoll
          - URing

    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{matrix.ruby}}
        bundler-cache: true
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ext/target
        key: ${{runner.os}}-${{matrix.ruby}}-${{matrix.selector}}-cargo-${{hashFiles('ext/Cargo.lock')}}

    - name: Install packages (Ubuntu)
      if: matrix.os == 'ubuntu'
      run: sudo apt-get install -y liburing-dev

    - name: Build extensions
      timeout-minutes: 5
      env:
        RB_SYS_CARGO_FEATURES: ${{matrix.selector == 'URing' && 'uring' || ''}}
      run: bundle exec bake build

    - name: Install wrk
      timeout-minutes: 5
      run: |
        git clone https://github.com/ioquatix/wrk
        cd wrk
        make

    - name: Run benchmarks (${{matrix.selector}})
      timeout-minutes: 10
      env:
        WRK: ./wrk/wrk
        IO_EVENT_SELECTOR: ${{matrix.selector}}
      run: bundle exec bake -b benchmark/server/bake.rb
